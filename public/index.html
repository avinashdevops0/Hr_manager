<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Manager - Microservices</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">HR Manager</div>
            <div class="nav-links">
                <a href="#employees" class="nav-link active">Employees</a>
                <a href="#attendance" class="nav-link">Attendance</a>
                <a href="#leaves" class="nav-link">Leaves</a>
                <a href="#payroll" class="nav-link">Payroll</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Dashboard Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Employees</div>
                <div class="stat-value" id="total-employees">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Present Today</div>
                <div class="stat-value" id="present-today">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Pending Leaves</div>
                <div class="stat-value" id="pending-leaves">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Pending Payroll</div>
                <div class="stat-value" id="pending-payroll">0</div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="content-area">
            <!-- Dynamic content will be loaded here -->
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
